# Advisories with no fixed release. Both packages arrive only through the
# Mintlify CLI, which runs on a contributor's machine & on the check host, on
# this repository's own files. Each expires, so the audit fails again until
# someone reviews it or upgrades.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-11-03T00:00:00Z
reason = "braces 3.0.3 overflows the stack on deeply nested brace patterns. No release fixes it. The CLI expands only this repository's own globs."

[[IgnoredVulns]]
id = "GHSA-ch52-4w7c-c8xp"
ignoreUntil = 2026-11-03T00:00:00Z
reason = "http-cache-semantics 4.2.0 can serve a cached response to another user of a shared cache. No release fixes it. The CLI's HTTP cache serves 1 local user."
