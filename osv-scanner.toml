# `bun run audit` scans package-lock.json with this file. An override states
# the license that a package's own files declare when deps.dev reports none or
# a non-standard one, & an ignore marks reviewed terms that have no SPDX
# identifier. Each names its exact version, so an upgrade needs a new review.

[[PackageOverrides]]
name = "@anthropic-ai/claude-agent-sdk"
version = "0.3.241"
ecosystem = "npm"
license.ignore = true
reason = "package.json points to Anthropic's Commercial Terms of Service, which no SPDX identifier names. They cover this development-only dependency."

