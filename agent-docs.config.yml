url: https://docs.xquik.com
# content-start-position stays disabled until main content starts before
# generated Mintlify navigation on every checked page.
# llms-txt-directive-html stays on when it warns on buried positions: generated
# Mintlify navigation can push API page bodies past 50%, a layout risk, not a
# missing directive.
checks:
  - llms-txt-exists
  - llms-txt-valid
  - llms-txt-size
  - llms-txt-links-resolve
  - llms-txt-links-markdown
  - llms-txt-directive-html
  - llms-txt-directive-md
  - markdown-url-support
  - content-negotiation
  - rendering-strategy
  - page-size-html
  - page-size-markdown
  - tabbed-content-serialization
  - section-header-quality
  - markdown-code-fence-validity
  - http-status-codes
  - redirect-behavior
  - llms-txt-coverage
  - markdown-content-parity
  - cache-header-hygiene
  - auth-gate-detection
  - auth-alternative-access
# The crawl reads every page on every run, so adding a page never changes which
# of the others it checks. maxLinksToTest stays above the page & link counts.
options:
  maxConcurrency: 32
  maxLinksToTest: 100000
  requestDelay: 0
  requestTimeout: 10000
  samplingStrategy: deterministic
