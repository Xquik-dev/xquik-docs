url: https://docs.xquik.com
# content-start-position stays disabled until main content starts before
# generated Mintlify navigation on every checked page.
# llms-txt-directive-html stays on when it warns on buried positions: generated
# Mintlify navigation can push API page bodies past 50%, a layout risk, not a
# missing directive.
checks:
  - llms-txt-exists
  - llms-txt-valid
  - llms-txt-size
  - llms-txt-links-resolve
  - llms-txt-links-markdown
  - llms-txt-directive-html
  - llms-txt-directive-md
  - markdown-url-support
  - content-negotiation
  - rendering-strategy
  - page-size-html
  - page-size-markdown
  - tabbed-content-serialization
  - section-header-quality
  - markdown-code-fence-validity
  - http-status-codes
  - redirect-behavior
  - llms-txt-coverage
  - markdown-content-parity
  - cache-header-hygiene
  - auth-gate-detection
  - auth-alternative-access
# The crawl reads these pages on every run, so adding a page to the site never
# changes which pages are checked. Every llms.txt link is tested.
pages:
  - https://docs.xquik.com
  - https://docs.xquik.com/alternatives/hootsuite
  - https://docs.xquik.com/alternatives/pipedream
  - https://docs.xquik.com/alternatives/taplio
  - https://docs.xquik.com/alternatives/x-api
  - https://docs.xquik.com/api-reference/api-keys/list
  - https://docs.xquik.com/api-reference/drafts/create
  - https://docs.xquik.com/api-reference/events/get
  - https://docs.xquik.com/api-reference/guest-wallets/status
  - https://docs.xquik.com/api-reference/monitors/list-keywords
  - https://docs.xquik.com/api-reference/styles/delete
  - https://docs.xquik.com/api-reference/support/media
  - https://docs.xquik.com/api-reference/webhooks/resume
  - https://docs.xquik.com/api-reference/x-accounts/list
  - https://docs.xquik.com/api-reference/x-write/follow
  - https://docs.xquik.com/api-reference/x-write/unlike
  - https://docs.xquik.com/api-reference/x/bookmark-folders
  - https://docs.xquik.com/api-reference/x/dm-history
  - https://docs.xquik.com/api-reference/x/list-followers
  - https://docs.xquik.com/api-reference/x/trend-locations
  - https://docs.xquik.com/api-reference/x/user-likes
  - https://docs.xquik.com/guides/ag2
  - https://docs.xquik.com/guides/error-handling
  - https://docs.xquik.com/guides/langchain
  - https://docs.xquik.com/guides/pipedream
  - https://docs.xquik.com/guides/troubleshooting
  - https://docs.xquik.com/guides/versioning
  - https://docs.xquik.com/mcp/docs-mcp
  - https://docs.xquik.com/sdks
  - https://docs.xquik.com/sdks/ruby
options:
  maxConcurrency: 32
  maxLinksToTest: 1000
  requestDelay: 0
  requestTimeout: 10000
