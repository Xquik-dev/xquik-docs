[extend]
useDefault = true

[[allowlists]]
description = "Literal documentation placeholder, never a usable credential."
targetRules = ["curl-auth-header", "generic-api-key"]
regexes = [
  '''^xq_(your_api_key_here|YOUR_KEY_HERE|your_guest_key_here)$''',
  '''^(a1b2c3d4e5f6){5}a1b2$''',
]

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Idempotency identifiers do not authenticate requests."
regexTarget = "match"
regexes = [
  '''^Idempotency-Key[":, ]+((follow|unfollow|dm)-44196397-1895432178065391234|unmute-44196397)"$''',
]

[[rules.allowlists]]
description = "Public domain ownership proof, also served in a verification file."
regexes = ['''^uda1iefj0dc1wig4yb4c3afl2m35st1ox7rufm0q4ljla00rmzazwhuyjvlgnzp2$''']

[[allowlists]]
description = "Sample keys, tokens, client secrets and idempotency keys that older docs examples showed. Each is a placeholder or a sequential made-up value that grants no access."
targetRules = ["curl-auth-header", "generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^a1b2c3d4-e5f6-7890-abcd-ef1234567890$''',
  '''^abc123def456$''',
  '''^f6(?:a1b2c3d4e5f6){5}a1$''',
  '''^pi_3abc\.\.\.secret_xyz$''',
  '''^pi_3abc_secret_xyz$''',
  '''^remove-follower-44196397$''',
  '''^whsec_a1b2c3d4e5f6\.\.\.$''',
  '''^whsec_a1b2c3d4e5f6(?:7890123456){2}7890abcdef$''',
  '''^whsec_abc123def456$''',
  '''^xq_a1b2c3d4e5f6\.\.\.$''',
  '''^xq_(?:a1b2c3d4e5f6){5}a1b2$''',
  '''^xq_live_abc123def456$''',
  '''^xqk_YOUR_KEY$''',
  '''^xqk_YOUR_KEY_HERE$''',
  '''^xqk_a1b2c3d4e5f6\.\.\.$''',
  '''^xqk_a1b2c3d4e5f6789012345678901234$''',
]
